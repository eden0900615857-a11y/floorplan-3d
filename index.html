<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>平面圖轉 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDF0F3; --panel:#F8FAFB; --ink:#16212C; --muted:#5B6875; --line:#CBD3DB;
  --accent:#1E5AA8; --accent-ink:#FFFFFF; --scene:#DCE2E8; --grid:rgba(30,90,168,.08);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --panel:#151D25; --ink:#E2E8EE; --muted:#93A1AE; --line:#2A3642;
    --accent:#6BA3EC; --accent-ink:#0B1520; --scene:#121A22; --grid:rgba(107,163,236,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --panel:#151D25; --ink:#E2E8EE; --muted:#93A1AE; --line:#2A3642;
  --accent:#6BA3EC; --accent-ink:#0B1520; --scene:#121A22; --grid:rgba(107,163,236,.07);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px;gap:12px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:12px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:500}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
button,.filebtn{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
.filebtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:hover,.filebtn:hover{border-color:var(--accent)}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}
.ctl label{font-size:13px}
.ctl output,.num{font-family:var(--mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.ctl input[type=number]{width:74px;font:12px var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
#preview{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;display:block}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.view{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--scene);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.viewtag{position:absolute;left:12px;bottom:10px;font:12px var(--mono);color:var(--muted);pointer-events:none}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 18%,transparent);border:2px dashed var(--accent);font-weight:500;color:var(--ink);pointer-events:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto}
  .view{height:62vh;min-height:340px;order:-1}
  .app{height:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>平面圖轉 3D</h1>
    <p>上傳一張房屋平面圖，自動辨識牆線並拉高成 3D 牆體。</p>
  </header>
  <div class="layout">
    <aside>
      <div class="group">
        <span class="label">平面圖</span>
        <div class="btnrow">
          <label class="filebtn">上傳圖片<input id="file" type="file" accept="image/*"></label>
          <button id="sample" type="button">載入範例</button>
        </div>
        <p class="hint">支援 JPG、PNG，也可以直接把圖片拖進右側畫面。PDF 請先轉成圖片。</p>
        <canvas id="preview" aria-label="牆線辨識結果"></canvas>
        <p class="hint">藍色是辨識為牆的部分，灰色是被過濾掉的文字、家具與標註線。</p>
      </div>

      <div class="group">
        <span class="label">牆線辨識</span>
        <div class="ctl">
          <label for="thr">黑白門檻</label><output id="thrOut"></output>
          <input id="thr" type="range" min="20" max="240" step="1" value="128">
        </div>
        <label class="check"><input id="autoThr" type="checkbox" checked>自動門檻（Otsu）</label>
        <div class="ctl">
          <label for="minT">最小牆厚</label><output id="minTOut"></output>
          <input id="minT" type="range" min="1" max="31" step="2" value="5">
        </div>
        <p class="hint">比這個寬度細的線條（文字、尺寸線、家具輪廓）會被忽略。牆沒出現就調小，雜訊太多就調大。</p>
        <label class="check"><input id="invert" type="checkbox">反相（深色底、淺色線的藍圖）</label>
      </div>

      <div class="group">
        <span class="label">尺寸</span>
        <div class="ctl">
          <label for="planW">圖面實際寬度（公尺）</label>
          <input id="planW" type="number" min="1" max="200" step="0.1" value="13.6">
        </div>
        <div class="ctl">
          <label for="wallH">牆高</label><output id="wallHOut"></output>
          <input id="wallH" type="range" min="1.8" max="4.5" step="0.1" value="2.8">
        </div>
      </div>

      <div class="group">
        <span class="label">結果</span>
        <dl class="stats">
          <dt>平面尺寸</dt><dd id="sSize">–</dd>
          <dt>牆體方塊</dt><dd id="sRects">–</dd>
          <dt>牆面積</dt><dd id="sArea">–</dd>
          <dt>處理時間</dt><dd id="sTime">–</dd>
        </dl>
        <div class="btnrow"><button id="resetCam" type="button">重設視角</button></div>
      </div>
    </aside>

    <div class="view" id="view">
      <span class="viewtag">左鍵拖曳旋轉 · 右鍵平移 · 滾輪縮放</span>
      <div class="drop" id="drop" hidden>放開以載入平面圖</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const MAX_SIDE = 900;          // 辨識用的工作解析度（長邊像素）
const MAX_RECTS = 40000;

/* ---------- 範例平面圖（程式繪製） ---------- */
function drawSamplePlan(){
  const c = document.createElement('canvas'); c.width = 1000; c.height = 700;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,1000,700);
  g.fillStyle = '#111';
  const walls = [
    // 外牆（厚 14）
    [60,60,160,14],[300,60,300,14],[700,60,240,14],
    [60,626,380,14],[520,626,420,14],
    [60,60,14,580],[926,60,14,580],
    // 內牆（厚 9）
    [420,74,9,306],[600,74,9,306],
    [429,300,100,9],
    [74,380,250,9],[394,380,35,9],
    [609,380,40,9],[719,380,207,9],
    [700,389,9,131]
  ];
  walls.forEach(w=>g.fillRect(...w));
  g.strokeStyle = '#111'; g.lineWidth = 1.5;
  // 窗（牆上缺口內的細雙線）
  [[220,300],[600,700]].forEach(([a,b])=>{
    g.beginPath(); g.moveTo(a,64); g.lineTo(b,64); g.moveTo(a,70); g.lineTo(b,70); g.stroke();
  });
  // 門（開門弧線與門片）
  const door=(hx,hy,r,a0,a1,lx,ly)=>{g.beginPath();g.arc(hx,hy,r,a0,a1);g.stroke();g.beginPath();g.moveTo(hx,hy);g.lineTo(lx,ly);g.stroke();};
  door(440,626,80,Math.PI*1.5,Math.PI*2,440,546);
  door(324,389,70,0,Math.PI/2,324,459);
  door(649,389,70,0,Math.PI/2,649,459);
  door(529,309,71,0,Math.PI/2,529,380);
  // 家具輪廓
  g.lineWidth = 2;
  g.strokeRect(110,110,150,200); g.strokeRect(110,110,150,40);
  g.strokeRect(700,110,130,180); g.strokeRect(700,110,130,36);
  g.strokeRect(140,540,260,70); g.strokeRect(210,450,120,60);
  g.strokeRect(760,580,150,40);
  g.beginPath(); g.ellipse(470,150,26,34,0,0,Math.PI*2); g.stroke();
  // 房間名稱與面積
  g.fillStyle = '#111'; g.textAlign = 'center';
  const label=(t,s,x,y)=>{g.font='600 22px "Noto Sans TC",sans-serif';g.fillText(t,x,y);g.font='15px "IBM Plex Mono",monospace';g.fillText(s,x,y+22);};
  label('主臥室','4.7 × 4.2 m',300,250);
  label('衛浴','2.3 × 3.0 m',515,230);
  label('次臥室','4.3 × 4.2 m',790,330);
  label('客廳','8.5 × 3.2 m',400,460);
  label('廚房','3.1 × 3.2 m',820,470);
  // 尺寸標註線
  g.lineWidth = 1; g.beginPath();
  g.moveTo(60,32); g.lineTo(940,32); g.moveTo(60,24); g.lineTo(60,40); g.moveTo(940,24); g.lineTo(940,40);
  g.moveTo(972,60); g.lineTo(972,640); g.moveTo(964,60); g.lineTo(980,60); g.moveTo(964,640); g.lineTo(980,640);
  g.stroke();
  g.font='14px "IBM Plex Mono",monospace'; g.fillText('12,000',500,26);
  g.save(); g.translate(990,350); g.rotate(-Math.PI/2); g.fillText('7,900',0,0); g.restore();
  return c;
}

/* ---------- 影像處理 ---------- */
let src = null;   // {w,h,gray:Uint8ClampedArray,rgba:ImageData}

function loadSource(canvasOrImg){
  const iw = canvasOrImg.naturalWidth || canvasOrImg.width;
  const ih = canvasOrImg.naturalHeight || canvasOrImg.height;
  const s = Math.min(1, MAX_SIDE / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw*s)), h = Math.max(1, Math.round(ih*s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.drawImage(canvasOrImg, 0, 0, w, h);
  const rgba = g.getImageData(0,0,w,h);
  const gray = new Uint8ClampedArray(w*h);
  for (let i=0,p=0;i<gray.length;i++,p+=4) gray[i] = (rgba.data[p]*0.299 + rgba.data[p+1]*0.587 + rgba.data[p+2]*0.114)|0;
  src = {w,h,gray,rgba,canvas:c};
}

function otsu(gray){
  const hist = new Float64Array(256); gray.forEach(v=>hist[v]++);
  const total = gray.length; let sum = 0; for (let i=0;i<256;i++) sum += i*hist[i];
  let sumB=0, wB=0, best=0, thr=128;
  for (let t=0;t<256;t++){
    wB += hist[t]; if (!wB) continue; const wF = total-wB; if (!wF) break;
    sumB += t*hist[t]; const mB = sumB/wB, mF = (sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF); if (between > best){best=between; thr=t;}
  }
  return thr;
}

function integral(mask,w,h){
  const W = w+1, I = new Int32Array(W*(h+1));
  for (let y=0;y<h;y++){ let row=0;
    for (let x=0;x<w;x++){ row += mask[y*w+x]; I[(y+1)*W+x+1] = I[y*W+x+1] + row; } }
  return I;
}
// 方形核的侵蝕 / 膨脹（用積分影像，速度與核大小無關）
function morph(mask,w,h,r,erode){
  const I = integral(mask,w,h), W = w+1, out = new Uint8Array(w*h);
  for (let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for (let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const s = I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0];
      out[y*w+x] = erode ? (s === (x1-x0)*(y1-y0) ? 1:0) : (s>0?1:0);
    }
  }
  return out;
}

// 把牆的像素合併成矩形（同一欄位範圍的橫向線段往下延伸）
function toRects(mask,w,h){
  const rects = []; let active = new Map();
  for (let y=0;y<h;y++){
    const next = new Map(); let x=0;
    while (x<w){
      if (!mask[y*w+x]){x++;continue;}
      const x0=x; while (x<w && mask[y*w+x]) x++;
      const key = x0*65536+x; let r = active.get(key);
      if (r) r.y1 = y+1; else { r = {x0,x1:x,y0:y,y1:y+1}; rects.push(r); }
      next.set(key,r);
    }
    active = next;
    if (rects.length > MAX_RECTS) break;
  }
  return rects;
}

function detect(){
  if (!src) return null;
  const t0 = performance.now();
  const {w,h,gray} = src;
  const inv = $('invert').checked;
  let thr = +$('thr').value;
  if ($('autoThr').checked){
    thr = otsu(gray); $('thr').value = thr;
  }
  $('thrOut').textContent = thr;
  const raw = new Uint8Array(w*h);
  for (let i=0;i<raw.length;i++) raw[i] = inv ? (gray[i] > thr ?1:0) : (gray[i] < thr ?1:0);
  const k = +$('minT').value, r = (k-1)>>1;
  const walls = r>0 ? morph(morph(raw,w,h,r,true),w,h,r,false) : raw;
  // 開運算可能把牆向外擴一點點，與原始黑色像素取交集
  for (let i=0;i<walls.length;i++) walls[i] &= raw[i];
  const rects = toRects(walls,w,h);
  let px=0; for (let i=0;i<walls.length;i++) px+=walls[i];
  return {raw,walls,rects,px,ms:performance.now()-t0};
}

function drawPreview(res){
  const {w,h,rgba} = src, cv = $('preview'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'), img = g.createImageData(w,h), d = img.data;
  const acc = [30,90,168];
  for (let i=0,p=0;i<w*h;i++,p+=4){
    if (res.walls[i]){ d[p]=acc[0]; d[p+1]=acc[1]; d[p+2]=acc[2]; }
    else if (res.raw[i]){ d[p]=175; d[p+1]=183; d[p+2]=191; }
    else { d[p]=255; d[p+1]=255; d[p+2]=255; }
    d[p+3]=255;
  }
  g.putImageData(img,0,0);
}

/* ---------- 3D 場景 ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 1000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.495;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8b98a6, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0005;
scene.add(sun); scene.add(sun.target);
const box = new THREE.BoxGeometry(1,1,1); box.translate(0,0.5,0);
const wallMat = new THREE.MeshStandardMaterial({color:0xeef1f4, roughness:0.85});
let walls3d = null, floor = null, floorTex = null, lastSpan = 10;

function build(res){
  if (walls3d){ scene.remove(walls3d); walls3d.dispose(); }
  if (floor){ scene.remove(floor); floor.geometry.dispose(); floor.material.dispose(); floorTex.dispose(); }
  const {w,h} = src;
  const planW = Math.max(1, +$('planW').value || 12), s = planW / w, H = +$('wallH').value;
  const n = Math.min(res.rects.length, MAX_RECTS);
  walls3d = new THREE.InstancedMesh(box, wallMat, Math.max(1,n));
  walls3d.count = n; walls3d.castShadow = true; walls3d.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i=0;i<n;i++){
    const r = res.rects[i];
    p.set(((r.x0+r.x1)/2 - w/2)*s, 0, ((r.y0+r.y1)/2 - h/2)*s);
    sc.set((r.x1-r.x0)*s, H, (r.y1-r.y0)*s);
    m.compose(p,q,sc); walls3d.setMatrixAt(i,m);
  }
  walls3d.instanceMatrix.needsUpdate = true;
  scene.add(walls3d);
  floorTex = new THREE.CanvasTexture(src.canvas); floorTex.encoding = THREE.sRGBEncoding;
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  floor = new THREE.Mesh(new THREE.PlaneGeometry(w*s, h*s), new THREE.MeshStandardMaterial({map:floorTex, roughness:1}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.001; floor.receiveShadow = true;
  scene.add(floor);
  const span = Math.max(w*s, h*s);
  const sh = sun.shadow.camera; sh.left=-span; sh.right=span; sh.top=span; sh.bottom=-span; sh.near=0.1; sh.far=span*4; sh.updateProjectionMatrix();
  sun.position.set(span*0.6, span*1.2, span*0.8);
  if (Math.abs(span - lastSpan) > 0.01){ lastSpan = span; resetCamera(); }
  $('sSize').textContent = (w*s).toFixed(1)+' × '+(h*s).toFixed(1)+' m';
  $('sRects').textContent = n.toLocaleString();
  $('sArea').textContent = (res.px*s*s).toFixed(1)+' m²';
  $('sTime').textContent = res.ms.toFixed(0)+' ms';
}

function resetCamera(){
  const span = lastSpan;
  camera.position.set(span*0.1, span*1.0, span*0.95);
  controls.target.set(0,0,0); controls.update();
}

function resize(){
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1,r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();

/* ---------- 串接 ---------- */
let timer = 0;
function run(){ clearTimeout(timer); timer = setTimeout(()=>{ const res = detect(); if (!res) return; drawPreview(res); build(res); }, 60); }
function syncOutputs(){
  $('minTOut').textContent = $('minT').value + ' px';
  $('wallHOut').textContent = (+$('wallH').value).toFixed(1) + ' m';
  $('thr').disabled = $('autoThr').checked;
}
['thr','minT','wallH','planW','autoThr','invert'].forEach(id=>$(id).addEventListener('input',()=>{syncOutputs();run();}));

function loadFile(file){
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = ()=>{ loadSource(img); URL.revokeObjectURL(url); lastSpan = -1; run(); };
  img.src = url;
}
$('file').addEventListener('change', e=>loadFile(e.target.files[0]));
$('sample').addEventListener('click', ()=>{ $('planW').value = 13.6; $('minT').value = 5; $('invert').checked=false; $('autoThr').checked=true; syncOutputs(); loadSource(drawSamplePlan()); lastSpan=-1; run(); });
$('resetCam').addEventListener('click', resetCamera);
let dragDepth = 0;
view.addEventListener('dragenter', e=>{e.preventDefault(); dragDepth++; $('drop').hidden=false;});
view.addEventListener('dragover', e=>e.preventDefault());
view.addEventListener('dragleave', ()=>{ if(--dragDepth<=0){dragDepth=0;$('drop').hidden=true;} });
